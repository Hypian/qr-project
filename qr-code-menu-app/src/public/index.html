<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Menu</title>
    <link rel="stylesheet" href="styles.css" />
    <link img rel="icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <header>
      <h1 class="sexy-heading">Welcome to Our Menu</h1>
    </header>
    <main>
      <div class="image-row">
        <img src="l1.jpg" alt="Theme Image 1" class="theme-img" />
        <img src="l2.jpg" alt="Theme Image 2" class="theme-img" />
      </div>
      <!-- Removed menu-items section -->
    </main>
    <footer>
      <p>&copy; DMC RESTAURANT</p>
    </footer>
    <div class="img-overlay" id="imgOverlay"></div>
    <script>
      (function () {
        const overlay = document.getElementById("imgOverlay");
        const imageRow = document.querySelector(".image-row");
        if (!imageRow) return;
        const images = Array.from(imageRow.querySelectorAll(".theme-img"));
        let currentIndex = null;
        let startX = null;

        function showZoom(index) {
          document.body.classList.add("zoomed-active");
          overlay.classList.add("visible");
          images.forEach((i) => i.classList.remove("zoomed"));
          images[index].classList.add("zoomed");
          imageRow.classList.add("dimmed");
          currentIndex = index;
        }

        function closeZoom() {
          document.body.classList.remove("zoomed-active");
          overlay.classList.remove("visible");
          images.forEach((img) => img.classList.remove("zoomed"));
          imageRow.classList.remove("dimmed");
          currentIndex = null;
        }

        images.forEach((img, idx) => {
          img.addEventListener("click", () => {
            if (img.classList.contains("zoomed")) {
              closeZoom();
              return;
            }
            showZoom(idx);
          });
        });''

        overlay.addEventListener("click", closeZoom);
        window.addEventListener("keydown", (e) => {
          if (e.key === "Escape") closeZoom();
          if (currentIndex !== null) {
            if (e.key === "ArrowLeft") {
              showZoom((currentIndex - 1 + images.length) % images.length);
            }
            if (e.key === "ArrowRight") {
              showZoom((currentIndex + 1) % images.length);
            }
          }
        });

        window.addEventListener("resize", () => {
          if (document.body.classList.contains("zoomed-active")) closeZoom();
        });

        // Swipe support for mobile
        overlay.addEventListener("touchstart", function (e) {
          if (e.touches.length === 1) startX = e.touches[0].clientX;
        });
        overlay.addEventListener("touchend", function (e) {
          if (startX === null || currentIndex === null) return;
          const endX = e.changedTouches[0].clientX;
          const deltaX = endX - startX;
          if (Math.abs(deltaX) > 50) {
            if (deltaX < 0) {
              // Swipe left
              showZoom((currentIndex + 1) % images.length);
            } else {
              // Swipe right
              showZoom((currentIndex - 1 + images.length) % images.length);
            }
          }
          startX = null;
        });
      })();
    </script>
    <script src="script.js"></script>
  </body>
</html>
